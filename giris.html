<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Giriş Yap - VELRON</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:390px;
    padding:25px;
}

.logo{
    text-align:center;

    font-family:Georgia,
        "Times New Roman",
        serif;

    font-size:24px;
    font-weight:bold;

    letter-spacing:7px;

    margin-bottom:45px;
}

.title{
    font-size:22px;
    font-weight:600;

    margin-bottom:8px;
}

.subtitle{
    color:#777;
    font-size:12px;

    margin-bottom:30px;
}

.google-button{
    width:100%;
    height:50px;

    background:#fff;
    color:#000;

    border:none;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

.google-button:active{
    opacity:.7;
}

.google-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.google-icon{
    width:20px;
    height:20px;

    border-radius:50%;

    background:#000;
    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:bold;
}

.message{
    display:none;

    text-align:center;

    color:#aaa;

    font-size:11px;

    margin-top:18px;

    line-height:1.5;

    word-break:break-word;
}

.register{
    text-align:center;

    margin-top:30px;

    color:#777;

    font-size:11px;
}

.register a{
    color:#fff;

    text-decoration:none;

    margin-left:5px;
}

</style>

</head>


<body>


<main class="container">


<div class="logo">
    VELRON
</div>


<h1 class="title">
    Giriş Yap
</h1>


<p class="subtitle">
    VELRON hesabına Google ile giriş yap.
</p>


<button
    id="googleButton"
    class="google-button"
    type="button"
>

    <span class="google-icon">
        G
    </span>

    Google ile devam et

</button>


<div
    id="message"
    class="message"
></div>


<div class="register">

    Hesabın yok mu?

    <a href="kayit.html">
        Kaydol
    </a>

</div>


</main>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD8osmrzNWj32T-1kNx-jmHlWcAm5_7xeg",

    authDomain:
        "velron-831db.firebaseapp.com",

    projectId:
        "velron-831db",

    storageBucket:
        "velron-831db.firebasestorage.app",

    messagingSenderId:
        "622435814773",

    appId:
        "1:622435814773:web:bd94aff51e78ba2a7c573c",

    measurementId:
        "G-74XHVN6V22"

};


/* =========================
   FIREBASE BAŞLAT
========================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const googleProvider =
    new GoogleAuthProvider();


/* =========================
   ELEMENTLER
========================= */

const googleButton =
    document.getElementById(
        "googleButton"
    );


const message =
    document.getElementById(
        "message"
    );


/* =========================
   ADMIN E-POSTA
========================= */

const ADMIN_EMAIL =
    "storevelron@gmail.com";


/* =========================
   MESAJ
========================= */

function showMessage(text){

    message.textContent =
        text;

    message.style.display =
        "block";

}


/* =========================
   GOOGLE GİRİŞ
========================= */

googleButton.addEventListener(
    "click",
    async function(){

        message.style.display =
            "none";


        googleButton.disabled =
            true;


        googleButton.innerHTML = `

            <span class="google-icon">
                G
            </span>

            Google açılıyor...

        `;


        try{

            const result =
                await signInWithPopup(
                    auth,
                    googleProvider
                );


            const user =
                result.user;


            console.log(
                "Giriş yapan:",
                user.email
            );


            showMessage(
                "Giriş başarılı. Yönlendiriliyorsun..."
            );


            setTimeout(
                function(){

                    /* ADMIN KONTROLÜ */

                    if(
                        user.email &&
                        user.email.toLowerCase() ===
                        ADMIN_EMAIL.toLowerCase()
                    ){

                        window.location.href =
                            "admin.html";

                    }else{

                        window.location.href =
                            "index.html";

                    }

                },
                500
            );


        }catch(error){

            console.error(
                "Google giriş hatası:",
                error
            );


            showMessage(
                "Google giriş hatası: " +
                error.code
            );


            googleButton.disabled =
                false;


            googleButton.innerHTML = `

                <span class="google-icon">
                    G
                </span>

                Google ile devam et

            `;

        }

    }
);


</script>

</body>

</html>
