<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="color-scheme" content="dark">

<meta name="theme-color" content="#000000">

<title>VELRON - Giriş</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#000;
    color-scheme:dark;
}

body{
    min-height:100vh;

    background:#000;
    color:#fff;

    font-family:Arial,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.container{
    width:100%;
    max-width:380px;

    text-align:center;
}

.logo{
    font-family:Georgia,"Times New Roman",serif;

    font-size:24px;
    font-weight:bold;

    letter-spacing:6px;

    margin-bottom:45px;
}

.title{
    font-size:18px;
    font-weight:500;

    margin-bottom:30px;
}

.google-button{
    width:100%;
    height:52px;

    border:1px solid #333;

    background:#fff;
    color:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.google-button:hover{
    background:#eaeaea;
}

.google-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.google-icon{
    width:20px;
    height:20px;
}

.error{
    display:none;

    margin-top:18px;

    color:#ff5555;

    font-size:11px;
    line-height:1.5;
}

.back{
    display:block;

    margin-top:25px;

    color:#777;

    text-decoration:none;

    font-size:11px;
}

.back:hover{
    color:#fff;
}

</style>

</head>


<body>


<div class="container">


<div class="logo">
    VELRON
</div>


<div class="title">
    Giriş Yap
</div>


<button
    class="google-button"
    id="googleButton"
    type="button"
>


<svg
    class="google-icon"
    viewBox="0 0 24 24"
>

<path
    fill="#4285F4"
    d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.95h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.23z"
/>

<path
    fill="#34A853"
    d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.29v2.52A9.74 9.74 0 0 0 12 21.5z"
/>

<path
    fill="#FBBC05"
    d="M6.53 13.61A5.86 5.86 0 0 1 6.22 12c0-.56.1-1.1.31-1.61V7.87H3.29A9.5 9.5 0 0 0 2.25 12c0 1.49.36 2.9 1.04 4.13l3.24-2.52z"
/>

<path
    fill="#EA4335"
    d="M12 6.36c1.43 0 2.72.49 3.74 1.46l2.8-2.8C16.83 3.45 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.37l3.24 2.52C7.3 8.08 9.46 6.36 12 6.36z"
/>

</svg>


Google ile devam et


</button>


<div
    class="error"
    id="error"
></div>


<a
    class="back"
    href="index.html"
>
    ← Ana sayfaya dön
</a>


</div>


<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================
   FIREBASE
========================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyD8osmrzNWj32T-1kNx-jmHlWcAm5_7xeg",

    authDomain:
    "velron-831db.firebaseapp.com",

    projectId:
    "velron-831db",

    storageBucket:
    "velron-831db.firebasestorage.app",

    messagingSenderId:
    "622435814773",

    appId:
    "1:622435814773:web:bd94aff51e78ba2a7c573c",

    measurementId:
    "G-74XHVN6V22"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const provider =
    new GoogleAuthProvider();


/* =========================
   ELEMENTS
========================= */


const googleButton =
    document.getElementById(
        "googleButton"
    );


const errorBox =
    document.getElementById(
        "error"
    );


/* =========================
   GOOGLE LOGIN
========================= */


googleButton.addEventListener(
    "click",
    async function(){

        errorBox.style.display =
            "none";

        googleButton.disabled =
            true;

        googleButton.textContent =
            "Giriş yapılıyor...";


        try{

            await signInWithPopup(
                auth,
                provider
            );


            window.location.href =
                "index.html";


        }catch(error){

            console.error(error);


            googleButton.disabled =
                false;

            googleButton.innerHTML = `

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24"
                >

                    <path
                        fill="#4285F4"
                        d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.95h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.23z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.44c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.29v2.52A9.74 9.74 0 0 0 12 21.5z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.53 13.61A5.86 5.86 0 0 1 6.22 12c0-.56.1-1.1.31-1.61V7.87H3.29A9.5 9.5 0 0 0 2.25 12c0 1.49.36 2.9 1.04 4.13l3.24-2.52z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 6.36c1.43 0 2.72.49 3.74 1.46l2.8-2.8C16.83 3.45 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.37l3.24 2.52C7.3 8.08 9.46 6.36 12 6.36z"
                    />

                </svg>

                Google ile devam et

            `;


            if(
                error.code ===
                "auth/popup-closed-by-user"
            ){

                return;

            }


            errorBox.textContent =
                "Giriş yapılırken bir hata oluştu. Lütfen tekrar deneyin.";

            errorBox.style.display =
                "block";

        }

    }
);

</script>

</body>

</html>
