<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap - VELRON</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    width:100%;
    max-width:400px;
    padding:30px 20px;
}

.logo{
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    font-weight:bold;
    letter-spacing:7px;
    margin-bottom:40px;
}

.title{
    font-size:24px;
    font-weight:500;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:11px;
    margin-bottom:30px;
}

.input{
    width:100%;
    height:48px;
    background:#080808;
    border:1px solid #292929;
    color:#fff;
    padding:0 14px;
    outline:none;
    font-size:12px;
    margin-bottom:12px;
}

.input:focus{
    border-color:#666;
}

.button{
    width:100%;
    height:48px;
    border:none;
    background:#fff;
    color:#000;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.google{
    width:100%;
    height:48px;
    background:#080808;
    border:1px solid #292929;
    color:#fff;
    font-size:11px;
    cursor:pointer;
    margin-top:12px;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:#555;
    font-size:9px;
    margin:20px 0;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    background:#222;
    flex:1;
}

.message{
    min-height:20px;
    text-align:center;
    color:#aaa;
    font-size:10px;
    margin-top:18px;
    line-height:1.5;
}

.register{
    text-align:center;
    margin-top:25px;
    color:#666;
    font-size:10px;
}

.register a{
    color:#fff;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#555;
    text-decoration:none;
    font-size:9px;
}

</style>
</head>

<body>

<div class="box">

    <div class="logo">
        VELRON
    </div>

    <div class="title">
        Giriş Yap
    </div>

    <div class="subtitle">
        VELRON hesabına giriş yap.
    </div>

    <input
        id="email"
        class="input"
        type="email"
        placeholder="E-posta"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="Şifre"
    >

    <button
        id="loginButton"
        class="button"
    >
        GİRİŞ YAP
    </button>

    <div class="divider">
        VEYA
    </div>

    <button
        id="googleButton"
        class="google"
    >
        GOOGLE İLE GİRİŞ YAP
    </button>

    <div
        id="message"
        class="message"
    ></div>

    <div class="register">
        Hesabın yok mu?
        <a href="kayit.html">Kayıt ol</a>
    </div>

    <a
        href="index.html"
        class="back"
    >
        ← ANA SAYFAYA DÖN
    </a>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyD8osmrzNWj32T-1kNx-jmHlWcAm5_7xeg",

    authDomain:
        "velron-831db.firebaseapp.com",

    projectId:
        "velron-831db",

    storageBucket:
        "velron-831db.firebasestorage.app",

    messagingSenderId:
        "622435814773",

    appId:
        "1:622435814773:web:bd94aff51e78ba2a7c573c",

    measurementId:
        "G-74XHVN6V22"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const provider =
    new GoogleAuthProvider();


const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const googleButton =
    document.getElementById(
        "googleButton"
    );

const message =
    document.getElementById(
        "message"
    );


const ADMIN_EMAIL =
    "storevelron@gmail.com";


function goAfterLogin(user){

    if(
        user &&
        user.email &&
        user.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href =
            "admin.html";

    }else{

        window.location.href =
            "index.html";

    }

}


/* =========================
   E-POSTA GİRİŞİ
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(
            !email ||
            !password
        ){

            message.textContent =
                "E-posta ve şifreyi gir.";

            return;

        }

        loginButton.disabled =
            true;

        message.textContent =
            "Giriş yapılıyor...";

        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            goAfterLogin(
                result.user
            );

        }catch(error){

            console.error(error);

            message.textContent =
                "Giriş başarısız. E-posta veya şifre hatalı.";

            loginButton.disabled =
                false;

        }

    }
);


/* =========================
   GOOGLE GİRİŞİ
========================= */

googleButton.addEventListener(
    "click",
    async function(){

        googleButton.disabled =
            true;

        message.textContent =
            "Google ile giriş yapılıyor...";

        try{

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );

            const user =
                result.user;

            goAfterLogin(
                user
            );

        }catch(error){

            console.error(
                "Google giriş hatası:",
                error
            );

            message.textContent =
                "Google ile giriş yapılamadı.";

            googleButton.disabled =
                false;

        }

    }
);

</script>

</body>
</html>
