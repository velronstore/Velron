<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Çizgili Kaplan Tasarımlı Beyaz Tişört - VELRON</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}


/* =========================
   HEADER
========================= */

.header{
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-bottom:1px solid #222;

    position:relative;
}

.back-button{
    position:absolute;
    left:15px;

    width:30px;
    height:30px;

    background:none;
    border:0;

    color:#fff;

    font-size:24px;

    cursor:pointer;
}

.logo{
    font-family:Georgia,"Times New Roman",serif;

    font-size:17px;
    font-weight:bold;

    letter-spacing:5px;
}


/* =========================
   FAVORİ
========================= */

.favorite-button{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    width:32px;
    height:32px;

    background:none;
    border:0;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:5;
}

.favorite-heart{
    font-size:25px;
    line-height:1;

    color:#fff;

    font-family:Arial,sans-serif;

    transition:
        color .2s ease,
        transform .2s ease;
}

.favorite-button.active .favorite-heart{
    color:#ff1744;
    transform:scale(1.18);
}

.favorite-button.animate .favorite-heart{
    animation:heartPop .35s ease;
}

@keyframes heartPop{

    0%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.45);
    }

    70%{
        transform:scale(.92);
    }

    100%{
        transform:scale(1.18);
    }

}


/* =========================
   ÜRÜN
========================= */

.product-page{
    width:100%;
    max-width:700px;

    margin:auto;

    padding-bottom:40px;
}

.product-image{
    width:100%;
    display:block;

    background:#000;
}

.product-image img{
    width:100%;
    height:auto;

    display:block;
}


/* =========================
   BİLGİ
========================= */

.product-info{
    padding:20px 18px 0;
}

.product-name{
    font-size:20px;
    font-weight:600;

    margin-bottom:8px;
}

.product-price{
    font-size:15px;
    color:#ddd;

    margin-bottom:25px;
}


/* =========================
   BEDEN
========================= */

.size-title{
    font-size:12px;
    color:#aaa;

    margin-bottom:10px;

    letter-spacing:1px;
}

.sizes{
    display:flex;
    gap:8px;

    margin-bottom:25px;
}

.size{
    width:52px;
    height:42px;

    background:#080808;
    color:#fff;

    border:1px solid #444;

    cursor:pointer;

    font-size:12px;
}

.size.active{
    background:#fff;
    color:#000;

    border-color:#fff;
}


/* =========================
   SEPET
========================= */

.add-cart{
    width:100%;
    height:50px;

    background:#fff;
    color:#000;

    border:0;

    font-size:12px;
    font-weight:bold;

    letter-spacing:1.5px;

    cursor:pointer;
}

.add-cart:active{
    opacity:.75;
}


/* =========================
   MESAJ
========================= */

.message{
    display:none;

    text-align:center;

    color:#aaa;

    font-size:11px;

    margin-top:13px;
}


/* =========================
   AÇIKLAMA
========================= */

.description{
    margin-top:35px;

    padding-top:25px;

    border-top:1px solid #292929;
}

.description-title{
    font-size:12px;
    font-weight:bold;

    letter-spacing:1px;

    margin-bottom:12px;
}

.description p{
    color:#aaa;

    font-size:12px;

    line-height:1.7;
}

</style>

</head>


<body>


<header class="header">


    <button
        class="back-button"
        onclick="history.back()"
    >
        ‹
    </button>


    <div class="logo">
        VELRON
    </div>


    <button
        class="favorite-button"
        id="favoriteButton"
        onclick="toggleFavorite()"
        aria-label="Favorilere ekle"
    >

        <span
            class="favorite-heart"
            id="favoriteHeart"
        >
            ♡
        </span>

    </button>


</header>



<main class="product-page">


    <div class="product-image">

        <img
            src="tiger-cizgili2.png"
            alt="Çizgili Kaplan Tasarımlı Beyaz Tişört"
        >

    </div>


    <div class="product-info">


        <div class="product-name">
            Çizgili Kaplan Tasarımlı Beyaz Tişört
        </div>


        <div class="product-price">
            499 TL
        </div>


        <div class="size-title">
            BEDEN
        </div>


        <div class="sizes">

            <button
                class="size"
                onclick="selectSize('S',this)"
            >
                S
            </button>


            <button
                class="size"
                onclick="selectSize('M',this)"
            >
                M
            </button>


            <button
                class="size"
                onclick="selectSize('L',this)"
            >
                L
            </button>

        </div>


        <button
            class="add-cart"
            onclick="addToCart()"
        >
            SEPETE EKLE
        </button>


        <div
            class="message"
            id="message"
        >
            Ürün sepete eklendi.
        </div>


        <div class="description">


            <div class="description-title">
                ÜRÜN DETAYI
            </div>


            <p>
                Çizgili Kaplan tasarımlı beyaz tişört.
                Normal kesimdir.
                S, M ve L beden seçenekleri bulunmaktadır.
            </p>


        </div>


    </div>


</main>



<script>


/* =========================
   ÜRÜN BİLGİSİ
========================= */

const product = {

    name:
        "Çizgili Kaplan Tasarımlı Beyaz Tişört",

    price:
        499,

    image:
        "tiger-cizgili2.png",

    category:
        "tisort",

    page:
        "tiger-cizgili2.html"

};


const CART_KEY =
    "velron_cart";


const FAVORITES_KEY =
    "velron_favorites";


let selectedSize =
    null;


/* =========================
   BEDEN SEÇ
========================= */

function selectSize(
    size,
    button
){

    selectedSize =
        size;


    document
        .querySelectorAll(".size")
        .forEach(
            function(item){

                item.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );

}


/* =========================
   FAVORİLERİ AL
========================= */

function getFavorites(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    FAVORITES_KEY
                )
            );


        if(
            !Array.isArray(data)
        ){

            return [];

        }


        return data.map(
            function(item){

                if(
                    typeof item ===
                    "string"
                ){

                    return item;

                }


                if(
                    item &&
                    item.name
                ){

                    return item.name;

                }


                return null;

            }
        ).filter(
            function(item){

                return item !== null;

            }
        );

    }catch(error){

        return [];

    }

}


/* =========================
   FAVORİLERİ KAYDET
========================= */

function saveFavorites(
    favorites
){

    localStorage.setItem(

        FAVORITES_KEY,

        JSON.stringify(
            favorites
        )

    );

}


/* =========================
   KALBİ GÜNCELLE
========================= */

function updateFavorite(){

    const favorites =
        getFavorites();


    const isFavorite =
        favorites.includes(
            product.name
        );


    const button =
        document.getElementById(
            "favoriteButton"
        );


    const heart =
        document.getElementById(
            "favoriteHeart"
        );


    if(isFavorite){

        button.classList.add(
            "active"
        );

        heart.textContent =
            "♥";

    }else{

        button.classList.remove(
            "active"
        );

        heart.textContent =
            "♡";

    }

}


/* =========================
   FAVORİYE EKLE / ÇIKAR
========================= */

function toggleFavorite(){

    let favorites =
        getFavorites();


    const index =
        favorites.indexOf(
            product.name
        );


    if(index === -1){

        favorites.push(
            product.name
        );

    }else{

        favorites.splice(
            index,
            1
        );

    }


    saveFavorites(
        favorites
    );


    const button =
        document.getElementById(
            "favoriteButton"
        );


    button.classList.remove(
        "animate"
    );


    void button.offsetWidth;


    button.classList.add(
        "animate"
    );


    setTimeout(
        function(){

            button.classList.remove(
                "animate"
            );

        },
        350
    );


    updateFavorite();

}


/* =========================
   SAYFA AÇILINCA
========================= */

updateFavorite();


/* =========================
   SEPETE EKLE
========================= */

function addToCart(){

    if(!selectedSize){

        alert(
            "Lütfen beden seç."
        );

        return;

    }


    let cart = [];


    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    CART_KEY
                )
            ) || [];

    }catch(error){

        cart = [];

    }


    const existing =
        cart.find(
            function(item){

                return(
                    item.name ===
                        product.name
                    &&
                    item.size ===
                        selectedSize
                );

            }
        );


    if(existing){

        existing.quantity += 1;

    }else{

        cart.push({

            name:
                product.name,

            price:
                product.price,

            image:
                product.image,

            category:
                product.category,

            size:
                selectedSize,

            quantity:
                1

        });

    }


    localStorage.setItem(

        CART_KEY,

        JSON.stringify(
            cart
        )

    );


    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        2000
    );

}

</script>


</body>

  </html>
