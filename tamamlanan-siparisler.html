<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tamamlanan Siparişler - VELRON</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    height:70px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:11px;
}

.logo{
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    font-weight:bold;
    letter-spacing:6px;
}

.header-space{
    width:50px;
}

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:40px 20px 60px;
}

.title{
    font-size:24px;
    font-weight:500;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:11px;
    margin-bottom:30px;
}

.orders{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.order{
    background:#080808;
    border:1px solid #292929;
    padding:20px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    padding-bottom:15px;
    border-bottom:1px solid #222;
}

.order-number{
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.order-date{
    color:#666;
    font-size:9px;
    margin-top:6px;
}

.status{
    border:1px solid #444;
    padding:7px 10px;
    color:#aaa;
    font-size:9px;
}

.products{
    padding-top:10px;
}

.product{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #1d1d1d;
}

.product:last-child{
    border-bottom:none;
}

.product-image{
    width:65px;
    height:80px;
    object-fit:contain;
    background:#111;
    flex-shrink:0;
}

.product-info{
    flex:1;
}

.product-name{
    font-size:11px;
    margin-bottom:7px;
}

.product-details{
    color:#888;
    font-size:9px;
    line-height:1.8;
}

.product-details strong{
    color:#fff;
}

.product-price{
    font-size:10px;
    margin-top:5px;
}

.order-total{
    border-top:1px solid #333;
    margin-top:8px;
    padding-top:15px;
    display:flex;
    justify-content:space-between;
}

.total-label{
    color:#777;
    font-size:10px;
}

.total-value{
    font-size:14px;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#666;
    border:1px solid #292929;
    padding:45px 20px;
    font-size:11px;
}

.loading{
    text-align:center;
    color:#777;
    font-size:11px;
    padding:50px 20px;
}

.login{
    text-align:center;
    padding:70px 20px;
}

.login-title{
    font-size:18px;
    margin-bottom:10px;
}

.login-text{
    color:#777;
    font-size:11px;
    margin-bottom:20px;
}

.login-button{
    display:inline-block;
    background:#fff;
    color:#000;
    text-decoration:none;
    padding:12px 20px;
    font-size:9px;
    font-weight:bold;
}

.error{
    text-align:center;
    color:#777;
    border:1px solid #292929;
    padding:30px 20px;
    font-size:10px;
    line-height:1.7;
}

@media(max-width:700px){

    .container{
        padding:30px 15px 50px;
    }

    .header{
        padding:0 15px;
    }

    .order-header{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <a
        href="hesabim.html"
        class="back"
    >
        ← GERİ
    </a>


    <div class="logo">
        VELRON
    </div>


    <div class="header-space"></div>

</header>


<!-- =========================
     LOADING
========================= -->

<div
    id="loading"
    class="loading"
>
    Siparişler yükleniyor...
</div>


<!-- =========================
     LOGIN
========================= -->

<div
    id="login"
    class="login"
    style="display:none;"
>

    <div class="login-title">
        Giriş yapmalısın
    </div>

    <div class="login-text">
        Tamamlanan siparişlerini görmek için
        hesabına giriş yap.
    </div>

    <a
        href="giris.html"
        class="login-button"
    >
        GİRİŞ YAP
    </a>

</div>


<!-- =========================
     CONTENT
========================= -->

<div
    id="content"
    style="display:none;"
>

    <main class="container">

        <h1 class="title">
            Tamamlanan Siparişler
        </h1>


        <p class="subtitle">
            Teslim edilen siparişlerin.
        </p>


        <div
            id="orders"
            class="orders"
        ></div>

    </main>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE AYARLARI
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD8osmrzNWj32T-1kNx-jmHlWcAm5_7xeg",

    authDomain:
        "velron-831db.firebaseapp.com",

    projectId:
        "velron-831db",

    storageBucket:
        "velron-831db.firebasestorage.app",

    messagingSenderId:
        "622435814773",

    appId:
        "1:622435814773:web:bd94aff51e78ba2a7c573c",

    measurementId:
        "G-74XHVN6V22"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================
   ELEMENTLER
========================= */

const loading =
    document.getElementById(
        "loading"
    );


const login =
    document.getElementById(
        "login"
    );


const content =
    document.getElementById(
        "content"
    );


const ordersElement =
    document.getElementById(
        "orders"
    );


/* =========================
   GİRİŞ KONTROLÜ
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        loading.style.display =
            "none";


        if(!user){

            login.style.display =
                "block";

            content.style.display =
                "none";

            return;

        }


        login.style.display =
            "none";

        content.style.display =
            "block";


        await loadOrders(
            user.uid
        );

    }
);


/* =========================
   SİPARİŞLERİ YÜKLE
========================= */

async function loadOrders(
    userId
){

    try{

        /*
         * Sadece kullanıcının
         * kendi siparişlerini alıyoruz.
         *
         * Rules tarafındaki alan:
         * kullaniciId
         */

        const ordersQuery =
            query(
                collection(
                    db,
                    "siparisler"
                ),
                where(
                    "kullaniciId",
                    "==",
                    userId
                )
            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        const orders =
            [];


        snapshot.forEach(
            function(doc){

                const order =
                    doc.data();


                /*
                 * ADMIN PANELİNDE
                 * "Teslim Edildi"
                 * seçildiğinde burada
                 * tamamlanan sipariş olarak
                 * gösterilecek.
                 *
                 * "Tamamlandı" da destekleniyor.
                 */

                if(
                    order.durum ===
                    "Teslim Edildi"
                    ||
                    order.durum ===
                    "Tamamlandı"
                ){

                    orders.push({

                        id:doc.id,

                        ...order

                    });

                }

            }
        );


        /*
         * En yeni sipariş üstte.
         */

        orders.sort(
            function(a,b){

                return getTime(
                    b.tarih
                )
                -
                getTime(
                    a.tarih
                );

            }
        );


        renderOrders(
            orders
        );


    }catch(error){

        console.error(
            "Sipariş geçmişi yüklenemedi:",
            error
        );


        ordersElement.innerHTML = `

            <div class="error">

                Sipariş geçmişi yüklenemedi.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   SİPARİŞLERİ GÖSTER
========================= */

function renderOrders(
    orders
){

    if(
        orders.length === 0
    ){

        ordersElement.innerHTML = `

            <div class="empty">

                Henüz tamamlanan siparişin
                bulunmuyor.

            </div>

        `;

        return;

    }


    ordersElement.innerHTML =
        "";


    orders.forEach(
        function(order){

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "order";


            const date =
                formatDate(
                    order.tarih
                );


            let productsHTML =
                "";


            /*
             * ÜRÜNLER
             */

            if(
                Array.isArray(
                    order.urunler
                )
            ){

                order.urunler.forEach(
                    function(product){

                        const price =
                            Number(
                                product.fiyat
                            ) || 0;


                        const quantity =
                            Number(
                                product.adet
                            ) || 0;


                        productsHTML += `

                            <div class="product">

                                <img
                                    class="product-image"
                                    src="${escapeHTML(
                                        product.resim || ""
                                    )}"
                                    alt=""
                                >


                                <div class="product-info">

                                    <div class="product-name">

                                        ${escapeHTML(
                                            product.isim ||
                                            "Ürün"
                                        )}

                                    </div>


                                    <div class="product-details">

                                        Beden:
                                        <strong>
                                            ${escapeHTML(
                                                product.beden ||
                                                "-"
                                            )}
                                        </strong>

                                        <br>

                                        Adet:
                                        <strong>
                                            ${quantity}
                                        </strong>

                                    </div>


                                    <div class="product-price">

                                        ${price * quantity} TL

                                    </div>

                                </div>

                            </div>

                        `;

                    }
                );

            }


            /*
             * SİPARİŞ KARTI
             */

            element.innerHTML = `

                <div class="order-header">

                    <div>

                        <div class="order-number">

                            ${escapeHTML(
                                order.siparisNo ||
                                "VEL-SİPARİŞ"
                            )}

                        </div>


                        <div class="order-date">

                            ${date}

                        </div>

                    </div>


                    <div class="status">

                        ${escapeHTML(
                            order.durum ||
                            "Teslim Edildi"
                        )}

                    </div>

                </div>


                <div class="products">

                    ${productsHTML}

                </div>


                <div class="order-total">

                    <div class="total-label">
                        TOPLAM
                    </div>


                    <div class="total-value">

                        ${
                            Number(
                                order.toplam
                            ) || 0
                        }

                        TL

                    </div>

                </div>

            `;


            ordersElement.appendChild(
                element
            );

        }
    );

}


/* =========================
   TARİH
========================= */

function getTime(
    value
){

    try{

        /*
         * Firestore Timestamp
         */

        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .getTime();

        }


        /*
         * Normal tarih
         */

        const date =
            new Date(
                value
            );


        const time =
            date.getTime();


        return isNaN(time)
            ? 0
            : time;

    }catch(error){

        return 0;

    }

}


function formatDate(
    value
){

    try{

        /*
         * Firestore Timestamp
         */

        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .toLocaleString(
                    "tr-TR"
                );

        }


        /*
         * Normal tarih
         */

        const date =
            new Date(
                value
            );


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "-";

        }


        return date.toLocaleString(
            "tr-TR"
        );

    }catch(error){

        return "-";

    }

}


/* =========================
   HTML GÜVENLİĞİ
========================= */

function escapeHTML(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value
        );


    return div.innerHTML;

}

</script>


</body>

</html>
